[package]
name = "watchtower"
version = "0.1.0"
edition = "2021"
description = "Watchtower — tamper-evident, hash-chained audit spine + mini-SIEM dashboard for the Steadholme stack."
license = "MIT OR Apache-2.0"

[lib]
name = "watchtower"
path = "src/lib.rs"

[[bin]]
name = "watchtower"
path = "src/main.rs"

[dependencies]
odyssey = { path = "../odyssey" }
# HTTP framework (shared with keystone/keyward): Json/State/Query extractors, typed responses.
axum = "0.8"
# Async runtime axum runs on. The Store trait is async: handlers `.await` it directly and
# PgStore uses sqlx natively, so a worker thread is NEVER blocked (no sync-over-async bridge).
# multi-thread keeps the serving runtime parallel for concurrent reads under append load.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
# Erase the async Store trait methods so `Arc<dyn Store>` stays object-safe (the handlers
# depend only on the trait, exactly like the keystone/keyward seam).
async-trait = "0.1"
# (De)serialize request/response bodies + build the verify/event JSON envelopes.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Ergonomic error/store enums -> JSON error envelope.
thiserror = "2"
# Structured logging.
tracing = "0.1"
tracing-subscriber = "0.3"
# SHA-256 for the append-only HASH CHAIN. Pure-Rust (no OpenSSL / aws-lc) so the binary
# depends only on glibc, exactly like keyward's `ring`-backed crypto choice.
sha2 = "0.10"
# Hex-encode the 32-byte chain hashes for the API + the TEXT prev_hash/hash columns.
hex = "0.4"
# Epoch -> UTC components for the dashboard timeline (std only — no formatting feature,
# no extra C deps). Same crate keyward already pins.
time = { version = "0.3", default-features = false, features = ["std"] }
# Portable PostgreSQL data layer. Runtime queries only (sqlx::query/Row) — NO compile-time
# macros, so the build needs NO database. rustls TLS (no openssl). The same standard-SQL
# statements later run unchanged on FusionDB over pgwire.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }

[dev-dependencies]
# ServiceExt::oneshot drives the Router in-process for the end-to-end tests (no port bind).
tower = { version = "0.5", features = ["util"] }
