<!DOCTYPE html>
<html lang="en"{{THEME_ATTR}}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="{{COLOR_SCHEME}}">
  <meta name="robots" content="noindex">
  <title>{{CODE}} · Watchtower</title>
  <link rel="stylesheet" href="{{CSS_PATH}}">
</head>
<body class="page-watch">
  {{SUITEBAR}}
  <main class="wt-page wt-narrow">
    <div class="status-wrap">
      <section class="status-tile">
        <div class="status-tile__code">{{CODE}}</div>
        <h1 class="status-tile__heading">{{HEADING}}</h1>
        <p class="status-tile__detail">{{DETAIL}}</p>
        <div><a class="btn btn-secondary" href="/">{{ICON_ARROW_LEFT}}Back to the audit timeline</a></div>
      </section>
    </div>
  </main>
</body>
</html>
