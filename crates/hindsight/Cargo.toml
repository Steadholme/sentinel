[package]
name = "hindsight"
version = "0.1.0"
edition = "2021"
description = "Hindsight — incident timeline / RCA correlator for the HOLDFAST stack."
license = "MIT OR Apache-2.0"

[lib]
name = "hindsight"
path = "src/lib.rs"

[[bin]]
name = "hindsight"
path = "src/main.rs"

[dependencies]
odyssey = { path = "../odyssey" }
# HTTP framework (shared with the estate): State/Path/Query/Form extractors, typed responses.
axum = "0.8"
# Async runtime axum runs on. The Store trait + LogReader are async (handlers `.await` them
# directly, PgStore drives sqlx natively — no sync-over-async bridge). `net`/`io-util`/`time`
# back the dependency-light outbound GET of Vitals/Watchtower (raw TCP HTTP/1.1, short timeout)
# and the non-blocking audit emitter. `rt-multi-thread` keeps the serving runtime parallel.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "net", "io-util", "time"] }
# Erase the async Store/LogReader trait methods so `Arc<dyn _>` stays object-safe (the same seam
# the rest of the estate uses).
async-trait = "0.1"
# Deserialize the urlencoded incident/note form bodies + the timeline query; serialize JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Ergonomic error/store enums -> HTTP error responses, and IO error wrapping for the fetch.
thiserror = "2"
# Structured logging.
tracing = "0.1"
tracing-subscriber = "0.3"
# Epoch -> UTC components for the timeline timestamps (std only — no C deps). Same crate the
# rest of the estate pins.
time = { version = "0.3", default-features = false, features = ["std"] }
# CSPRNG bytes for the double-submit CSRF token + ids. `getrandom` is a tiny libc-backed shim,
# and `hex` encodes the token.
getrandom = "0.2"
hex = "0.4"
# Portable PostgreSQL data layer for the OWN incidents/notes db AND the READ-ONLY Sift logs
# pool. Runtime queries only (sqlx::query/Row) — NO compile-time macros, so the build needs NO
# database. rustls TLS (no openssl). Standard SQL only, so the same statements run unchanged on
# FusionDB over pgwire.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }

[dev-dependencies]
# ServiceExt::oneshot drives the Router in-process for the end-to-end tests (no port bind).
tower = { version = "0.5", features = ["util"] }
